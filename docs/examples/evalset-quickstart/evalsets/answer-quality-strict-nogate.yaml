apiVersion: mizan.dev/v1alpha1
kind: EvalSet
metadata:
  id: quickstart/answer-quality-strict-nogate
  name: Answer Quality Suite (strict, no gate)
  description: >
    Identical to answer-quality-strict-gate (same strict threshold) but with the
    gate OFF. The scorecard still reports the FAILED verdict, yet the process
    exits 0 — the difference the opt-in gate makes.
  version: 1.0.0
  assetClass: text-answer
  tags: [quality, text]
spec:
  inputs:
    prompt: prompt
    response: response
  members:
    - metric: quickstart/response-helpfulness
      weight: 2
    - metric: quickstart/response-conciseness
      weight: 1
  aggregation:
    method: weighted-mean
    threshold: 4.9                       # same strict threshold as the gated variant
    gate: false                          # gate OFF: FAILED verdict but exit stays 0
  display:
    order: as-listed
