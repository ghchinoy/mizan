<!DOCTYPE html>
<!--
  Mizan results report — neutral, self-contained template.

  This file is filled by scripts/render_report.py: the single placeholder
  __MIZAN_REPORT_DATA__ (inside the application/json script block below) is
  replaced with the aggregated report model as embedded JSON. Everything is
  inline (CSS + JS + data); the rendered report.html makes NO network request,
  loads NO external asset, and starts NO server — it opens directly from the
  filesystem. It is deliberately NOT coupled to the Mizan docs-site styling.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mizan Results Report</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1d21; --muted: #5b6470; --line: #e2e6ea;
    --card: #f6f8fa; --accent: #2b6cb0; --pass: #2f855a; --fail: #c53030;
    --grid: #edf1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --fg: #e8ecef; --muted: #9aa4ad; --line: #2a3138;
      --card: #1c2126; --accent: #63b3ed; --pass: #68d391; --fail: #fc8181;
      --grid: #232a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { margin: 0 0 4px; font-size: 26px; }
  header .meta { color: var(--muted); font-size: 13px; }
  h2 { font-size: 19px; margin: 40px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .cards { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; min-width: 150px; flex: 1;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.pass { background: color-mix(in srgb, var(--pass) 20%, transparent); color: var(--pass); }
  .pill.fail { background: color-mix(in srgb, var(--fail) 20%, transparent); color: var(--fail); }
  .pill.neutral { background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--muted); }
  svg { max-width: 100%; height: auto; display: block; margin-top: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  details { margin-top: 6px; }
  details > summary { cursor: pointer; }
  .kv { color: var(--muted); }
  .explanation { white-space: pre-wrap; margin: 6px 0 0; }
  .empty {
    background: var(--card); border: 1px dashed var(--line); border-radius: 10px;
    padding: 28px; text-align: center; color: var(--muted); margin-top: 16px;
  }
  .empty code { background: var(--grid); padding: 2px 6px; border-radius: 5px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
  .warn { color: var(--fail); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="report-title">Mizan Results Report</h1>
    <div class="meta" id="report-meta"></div>
  </header>
  <main id="content"></main>
  <footer>
    Generated by the Mizan <code>report-to-html</code> agent skill. Self-contained &mdash; no server, no external requests.
  </footer>
</div>

<script id="mizan-report-data" type="application/json">__MIZAN_REPORT_DATA__</script>
<script>
"use strict";
(function () {
  var PALETTE = ["#2b6cb0", "#dd6b20", "#38a169", "#805ad5", "#d53f8c",
                 "#319795", "#b7791f", "#e53e3e", "#3182ce", "#718096"];

  function readData() {
    var el = document.getElementById("mizan-report-data");
    try { return JSON.parse(el.textContent); }
    catch (e) { return null; }
  }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    if (kids != null) {
      if (!Array.isArray(kids)) kids = [kids];
      kids.forEach(function (c) {
        if (c == null) return;
        n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
    }
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function fmt(x, d) {
    if (x == null || isNaN(x)) return "—";
    var p = d == null ? 2 : d;
    return Number(x).toFixed(p).replace(/\.?0+$/, "");
  }
  function pct(x) { return x == null ? "—" : (Math.round(x * 1000) / 10) + "%"; }

  function summaryCards(s) {
    var wrap = el("div", { class: "cards" });
    function card(label, value) {
      return el("div", { class: "card" }, [
        el("div", { class: "label" }, label),
        el("div", { class: "value" }, value),
      ]);
    }
    wrap.appendChild(card("Results", String(s.count)));
    wrap.appendChild(card("Mean score", fmt(s.mean)));
    wrap.appendChild(card("Min / Max", fmt(s.min) + " / " + fmt(s.max)));
    wrap.appendChild(card("Pass-rate (≥" + fmt(s.threshold) + ")", pct(s.pass_rate)));
    if (s.pairwise_count) wrap.appendChild(card("Pairwise", String(s.pairwise_count)));
    return wrap;
  }

  function perMetricTable(rows) {
    var t = el("table");
    var head = el("tr", null, [
      el("th", null, "Metric"),
      el("th", { class: "num" }, "N"),
      el("th", { class: "num" }, "Mean"),
      el("th", { class: "num" }, "Min"),
      el("th", { class: "num" }, "Max"),
      el("th", { class: "num" }, "Pass-rate"),
    ]);
    t.appendChild(el("thead", null, head));
    var body = el("tbody");
    rows.forEach(function (r) {
      body.appendChild(el("tr", null, [
        el("td", null, r.id),
        el("td", { class: "num" }, String(r.count)),
        el("td", { class: "num" }, fmt(r.mean)),
        el("td", { class: "num" }, fmt(r.min)),
        el("td", { class: "num" }, fmt(r.max)),
        el("td", { class: "num" }, r.scored_count ? pct(r.pass_rate) : "—"),
      ]));
    });
    t.appendChild(body);
    return t;
  }

  function distributionChart(dist) {
    if (!dist || !dist.bins || !dist.bins.length) return el("p", { class: "kv" }, "No numeric scores to chart.");
    var W = 1000, H = 260, padL = 44, padB = 40, padT = 12, padR = 12;
    var bins = dist.bins;
    var maxC = Math.max.apply(null, bins.map(function (b) { return b.count; })) || 1;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Score distribution" });
    // y axis gridlines
    for (var g = 0; g <= 4; g++) {
      var y = padT + (H - padT - padB) * (g / 4);
      svg.appendChild(svgEl("line", { x1: padL, y1: y, x2: W - padR, y2: y, stroke: "var(--grid)", "stroke-width": 1 }));
      var lab = svgEl("text", { x: padL - 6, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      lab.textContent = String(Math.round(maxC * (1 - g / 4)));
      svg.appendChild(lab);
    }
    var bw = (W - padL - padR) / bins.length;
    bins.forEach(function (b, i) {
      var h = (H - padT - padB) * (b.count / maxC);
      var x = padL + i * bw;
      var y = H - padB - h;
      svg.appendChild(svgEl("rect", { x: x + 3, y: y, width: Math.max(1, bw - 6), height: h, fill: "var(--accent)", rx: 3 }));
      var xl = svgEl("text", { x: x + bw / 2, y: H - padB + 16, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
      xl.textContent = b.label;
      svg.appendChild(xl);
      if (b.count > 0) {
        var cl = svgEl("text", { x: x + bw / 2, y: y - 4, "text-anchor": "middle", "font-size": 11, fill: "var(--fg)" });
        cl.textContent = String(b.count);
        svg.appendChild(cl);
      }
    });
    return svg;
  }

  function trendChart(series, threshold) {
    var withPts = (series || []).filter(function (s) { return s.points && s.points.length; });
    if (!withPts.length) return el("p", { class: "kv" }, "No dated numeric scores to chart a trend.");
    var W = 1000, H = 320, padL = 44, padB = 30, padT = 12, padR = 12;
    var allT = [], allV = [];
    withPts.forEach(function (s) {
      s.points.forEach(function (p) { allT.push(new Date(p.t).getTime()); allV.push(p.score); });
    });
    var tMin = Math.min.apply(null, allT), tMax = Math.max.apply(null, allT);
    var vMin = Math.min.apply(null, allV), vMax = Math.max.apply(null, allV);
    if (vMin === vMax) { vMin -= 1; vMax += 1; }
    if (tMin === tMax) { tMax = tMin + 1; }
    function sx(t) { return padL + (W - padL - padR) * ((t - tMin) / (tMax - tMin)); }
    function sy(v) { return padT + (H - padT - padB) * (1 - (v - vMin) / (vMax - vMin)); }
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Per-metric score trend" });
    for (var g = 0; g <= 4; g++) {
      var v = vMin + (vMax - vMin) * (g / 4);
      var y = sy(v);
      svg.appendChild(svgEl("line", { x1: padL, y1: y, x2: W - padR, y2: y, stroke: "var(--grid)", "stroke-width": 1 }));
      var lab = svgEl("text", { x: padL - 6, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      lab.textContent = fmt(v, 1);
      svg.appendChild(lab);
    }
    if (threshold != null && threshold >= vMin && threshold <= vMax) {
      var ty = sy(threshold);
      svg.appendChild(svgEl("line", { x1: padL, y1: ty, x2: W - padR, y2: ty, stroke: "var(--fail)", "stroke-width": 1, "stroke-dasharray": "5 4" }));
    }
    withPts.forEach(function (s, si) {
      var color = PALETTE[si % PALETTE.length];
      var pts = s.points.slice().sort(function (a, b) { return new Date(a.t) - new Date(b.t); });
      var d = pts.map(function (p, i) { return (i ? "L" : "M") + sx(new Date(p.t).getTime()) + " " + sy(p.score); }).join(" ");
      svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: color, "stroke-width": 2 }));
      pts.forEach(function (p) {
        svg.appendChild(svgEl("circle", { cx: sx(new Date(p.t).getTime()), cy: sy(p.score), r: 3, fill: color }));
      });
    });
    var legend = el("div", { class: "legend" });
    withPts.forEach(function (s, si) {
      legend.appendChild(el("div", { class: "item" }, [
        el("span", { class: "swatch", style: "background:" + PALETTE[si % PALETTE.length] }),
        s.id,
      ]));
    });
    return el("div", null, [svg, legend]);
  }

  function resultsTable(results) {
    var t = el("table");
    t.appendChild(el("thead", null, el("tr", null, [
      el("th", null, "Run"),
      el("th", null, "When"),
      el("th", null, "Metric"),
      el("th", { class: "num" }, "Outcome"),
      el("th", null, "Model"),
      el("th", null, "Detail"),
    ])));
    var body = el("tbody");
    results.forEach(function (r) {
      var outcome;
      if (r.score != null) {
        var cls = r.passed == null ? "neutral" : (r.passed ? "pass" : "fail");
        outcome = el("span", { class: "pill " + cls }, fmt(r.score));
      } else if (r.choice) {
        outcome = el("span", { class: "pill neutral" }, r.choice);
      } else {
        outcome = document.createTextNode("—");
      }
      var det = el("details");
      det.appendChild(el("summary", null, "view"));
      if (r.explanation) det.appendChild(el("p", { class: "explanation" }, r.explanation));
      if (r.warnings && r.warnings.length) {
        det.appendChild(el("p", { class: "warn" }, "⚠ " + r.warnings.join(" | ")));
      }
      var kv = el("div", { class: "kv" });
      kv.appendChild(el("div", null, "RunID: " + r.run_id));
      if (r.duration_ms != null) kv.appendChild(el("div", null, "Duration: " + fmt(r.duration_ms, 0) + " ms"));
      if (r.tokens) kv.appendChild(el("div", null, "Tokens: " + r.tokens));
      if (r.custom_output) {
        var pre = el("pre", { class: "explanation" }, JSON.stringify(r.custom_output, null, 2));
        det.appendChild(el("div", { class: "kv" }, "Per-criterion / custom output:"));
        det.appendChild(pre);
      }
      det.appendChild(kv);
      body.appendChild(el("tr", null, [
        el("td", null, r.run_id ? r.run_id.slice(0, 10) + "…" : "—"),
        el("td", null, r.run_at || "—"),
        el("td", null, r.metric || "—"),
        el("td", { class: "num" }, outcome),
        el("td", null, r.model || "—"),
        el("td", null, det),
      ]));
    });
    t.appendChild(body);
    return t;
  }

  function render() {
    var data = readData();
    var content = document.getElementById("content");
    if (!data) {
      content.appendChild(el("p", { class: "warn" }, "Report data could not be parsed."));
      return;
    }
    document.title = data.title || "Mizan Results Report";
    document.getElementById("report-title").textContent = data.title || "Mizan Results Report";
    var metaBits = [];
    if (data.generated_at) metaBits.push("Generated " + data.generated_at);
    metaBits.push(data.summary.count + " result" + (data.summary.count === 1 ? "" : "s"));
    if (data.filters_note) metaBits.push(data.filters_note);
    metaBits.push("pass threshold ≥ " + fmt(data.summary.threshold));
    document.getElementById("report-meta").textContent = metaBits.join(" · ");

    if (!data.summary.count) {
      content.appendChild(el("div", { class: "empty" }, [
        el("p", null, "No eval results found in the store yet."),
        el("p", null, [
          document.createTextNode("Run an evaluation first, e.g. "),
          el("code", null, "mizan eval run --metric <ns>/<slug> --field response=... -o json"),
          document.createTextNode(", then regenerate this report."),
        ]),
      ]));
      return;
    }

    content.appendChild(summaryCards(data.summary));

    content.appendChild(el("h2", null, "Per-metric summary"));
    content.appendChild(perMetricTable(data.per_metric || []));

    content.appendChild(el("h2", null, "Score distribution"));
    content.appendChild(distributionChart(data.distribution));

    content.appendChild(el("h2", null, "Per-metric trend"));
    content.appendChild(trendChart(data.trend, data.summary.threshold));

    content.appendChild(el("h2", null, "Results"));
    content.appendChild(resultsTable(data.results || []));
  }

  render();
})();
</script>
</body>
</html>
