apiVersion: mizan.dev/v1alpha1
kind: EvalSet
metadata:
  id: multimodal-judge/multimodal-judge-core
  name: Multimodal Judge Core Evaluation Suite
  description: >
    Core four-dimension multimodal evaluation suite covering fine-print visual
    verification, Set-of-Mark UI grounding, visual pairwise preference, and
    untrusted OCR prompt-injection quarantine.
  version: 0.1.0
  assetClass: multimodal-response
  tags: [multimodal, grounding, ui, safety, suite]
spec:
  members:
    - metric: multimodal-judge/fine-print-verify
      weight: 1.0
    - metric: multimodal-judge/som-ui-grounding
      weight: 1.0
    - metric: multimodal-judge/visual-pairwise-preference
      weight: 1.0
    - metric: multimodal-judge/untrusted-ocr-quarantine
      weight: 1.5
  aggregation:
    method: weighted-mean
    threshold: 0.85
    gate: true
  display:
    order: as-listed
