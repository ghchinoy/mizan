apiVersion: mizan.dev/v1alpha1
kind: EvalSet
metadata:
  id: multimodal-judge/multimodal-judge-core
  name: Synthetic Multimodal Core Suite
  description: Synthetic four-kind multimodal suite fixture.
  version: 0.1.0
  assetClass: multimodal-response
  tags: [multimodal, test]
spec:
  members:
    - metric: multimodal-judge/fine-print-verify
      weight: 1.0
    - metric: multimodal-judge/som-ui-grounding
      weight: 1.0
    - metric: multimodal-judge/visual-pairwise-preference
      weight: 1.0
    - metric: multimodal-judge/untrusted-ocr-quarantine
      weight: 1.5
  aggregation:
    method: weighted-mean
    threshold: 2.2
    gate: true
  display:
    order: as-listed
