# Release workflow — builds cross-platform mizan binaries and attaches them to
# the GitHub Release for the pushed tag.
#
# How to cut a release:
#   git tag v1.2.3
#   git push origin v1.2.3
# The tag push triggers this workflow. Once a vX.Y.Z tag exists, the
# `mizan-templates` validate-packs CI can pin MIZAN_VERSION=vX.Y.Z instead of
# tracking @main.
#
# Plain Go cross-compilation is used (no GoReleaser) — it is fully self-contained,
# CGO-free, and injects the same ldflags vars defined in internal/version, so the
# reported `mizan version` matches the tag. Build is a matrix over the target
# OS/arch set.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="github.com/ghchinoy/mizan/internal/version"
          LDFLAGS="-s -w -X ${PKG}.version=${VERSION} -X ${PKG}.commit=${COMMIT} -X ${PKG}.date=${DATE}"
          NAME="mizan_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${NAME}"
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${NAME}/mizan" ./cmd/mizan
          cp README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
