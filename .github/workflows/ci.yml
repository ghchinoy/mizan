name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# De-duplicate runs: cancel any in-progress run for the same ref when a new
# push arrives, so re-pushes don't pile up.
# cancel-in-progress also cancels superseded main pushes — intentional: the
# newest commit on a ref is the one whose CI result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build / vet / fmt / test / vuln / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Mizan is CGO-free (pure-Go modernc.org/sqlite). Keep the C toolchain out
      # of the build so binaries stay statically linkable and reproducible.
      CGO_ENABLED: "0"
    steps:
      # Major-version action pins (@v4/@v5) kept intentionally: this workflow has
      # contents: read only, no secrets, and no pull_request_target, so blast
      # radius is minimal; major pins stay readable and auto-receive patch/security
      # fixes. Revisit SHA-pinning if permissions broaden or secrets are added.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go toolchain — track go.mod.
          go-version-file: go.mod

      - name: Build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: make fmt-check

      - name: Install govulncheck
        run: |
          # Pinned to a released tag for reproducibility; bump deliberately.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: govulncheck
        run: govulncheck ./...

      - name: Test + coverage (measure + print, no floor)
        run: |
          # Single canonical test run: -coverprofile runs all tests AND produces
          # the profile, so a test failure still fails CI (tests run once).
          go test -coverprofile=coverage.out ./...
          echo "::group::Per-function coverage"
          go tool cover -func=coverage.out
          echo "::endgroup::"
          echo "Total coverage:"
          go tool cover -func=coverage.out | tail -1

      - name: Coverage floor (soft, NON-BLOCKING)
        run: |
          # A soft nudge, NOT a gate: warn (never fail) when total coverage dips
          # below the floor. Reuses coverage.out from the step above — no second
          # test run. The floor is tuned a little BELOW current reality (R-GAPS
          # measured ~78.5%) so it is a real signal with headroom, not an
          # unmeetable bar; raise it deliberately as coverage grows.
          FLOOR=75.0
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}% (soft floor: ${FLOOR}%)"
          if awk -v t="$TOTAL" -v f="$FLOOR" 'BEGIN { exit !(t < f) }'; then
            echo "::warning::Total coverage ${TOTAL}% is below the soft floor ${FLOOR}% (non-blocking)."
          else
            echo "Coverage ${TOTAL}% is at or above the soft floor ${FLOOR}%."
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep the CGO-free contract consistent with the build-test job.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go toolchain — track go.mod.
          go-version-file: go.mod

      - name: golangci-lint
        # golangci-lint v2 requires golangci-lint-action @v7 — the @v6 line
        # targets linter v1, so pairing @v6 with a v2 `version` made the CI lint
        # step non-deterministic while `make lint` stayed green locally (local
        # skips the Action wrapper). @v7 + explicit v2.12.2 keeps CI reproducible
        # and consistent with the curated .golangci.yml (schema v2). Bump the
        # version deliberately.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  doc-drift:
    name: docs / doc-drift guard
    # Living-docs DoD nudge (R-DOCS-DOD): if a PR touches cmd/mizan/ or
    # internal/eval/ but ships no docs, fail — unless explicitly overridden.
    # This is a nudge, not a hard wall: the override below always works.
    # Runs on pull_request only (needs the PR payload for base ref/labels/body).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff against the PR base resolves.
          fetch-depth: 0

      - name: Doc-drift check
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # ---- Escape hatches (override always wins) ----------------------
          # 1) A "docs: N/A" label on the PR.
          if printf '%s' "$PR_LABELS" | tr ',' '\n' \
               | grep -qiE '^[[:space:]]*docs:[[:space:]]*n/a[[:space:]]*$'; then
            echo "Override: 'docs: N/A' label present — doc-drift guard skipped."
            exit 0
          fi
          # 2) A "docs: N/A" marker on a line of its OWN in the PR body.
          #    Anchored to a standalone line so incidental prose (including the
          #    PR template's own explanatory comment) never trips the override.
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*docs:[[:space:]]*n/a[[:space:]]*$'; then
            echo "Override: standalone 'docs: N/A' line found in PR body — doc-drift guard skipped."
            exit 0
          fi

          # ---- Determine files changed in this PR -------------------------
          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "::group::Changed files"
          echo "$CHANGED"
          echo "::endgroup::"

          CODE_CHANGED=false
          DOC_CHANGED=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              cmd/mizan/*|internal/eval/*) CODE_CHANGED=true ;;
            esac
            case "$f" in
              docs/llm-as-judge-scenarios.md) DOC_CHANGED=true ;;
              docs/*guide.md)                 DOC_CHANGED=true ;;
            esac
          done <<< "$CHANGED"

          # ---- Decision --------------------------------------------------
          if [ "$CODE_CHANGED" = true ] && [ "$DOC_CHANGED" = false ]; then
            echo "::error::Doc-drift: this PR changes cmd/mizan/ or internal/eval/ but updates no docs."
            echo ""
            echo "Update at least one of:"
            echo "  - docs/llm-as-judge-scenarios.md"
            echo "  - docs/user-guide.md or docs/testing-guide.md (docs/*guide.md)"
            echo ""
            echo "If docs genuinely do not apply, override the guard by EITHER:"
            echo "  - adding the 'docs: N/A' label to this PR, OR"
            echo "  - adding a line 'docs: N/A' to the PR body."
            exit 1
          fi

          echo "doc-drift guard passed (code changed: ${CODE_CHANGED}, docs changed: ${DOC_CHANGED})."
